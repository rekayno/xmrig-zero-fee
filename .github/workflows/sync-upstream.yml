name: Sync upstream

# Keeps this fork close to xmrig/xmrig without conflicts.
# Safe by design: this fork never commits changes under src/,
# the zero-fee patch lives only in build.yml's runtime step.
#
# - Manual: Actions tab -> Sync upstream -> Run workflow
# - Automatic: daily at 06:00 UTC (only fast-forwards/merges, never force-pushes)
# If upstream refactored donate code, build.yml's verify step will fail
# loudly instead of silently building a fee build. Fix the regex, don't fork the source.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge xmrig/xmrig master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/xmrig/xmrig.git || true
          git fetch upstream
          git checkout master || git checkout -b master
          if git merge --no-edit upstream/master; then
            echo "merge OK"
          else
            echo "::error::Merge conflict. Resolve manually:"
            echo "  git fetch upstream && git merge upstream/master"
            git status --short
            git merge --abort || true
            exit 1
          fi
          # Safety: fork must never contain src/ modifications.
          if [ -n "$(git diff --name-only HEAD~1 HEAD -- src/ 2>/dev/null || true)" ]; then
            echo "::warning::Last sync touched src/. This fork is supposed to keep src/ pristine (fee patch is CI-only)."
          fi
          git push origin HEAD:master
